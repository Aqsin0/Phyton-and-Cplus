<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şagird Reytinq Paneli</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --positive: #22c55e;
            --negative: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            color: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .refresh-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background-color: #1d4ed8;
        }

        .table-wrapper {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #0f172a;
            color: var(--accent);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: #26334d;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .student-name {
            font-weight: 600;
        }

        .badge-positive {
            color: var(--positive);
            font-weight: bold;
        }

        .badge-negative {
            color: var(--negative);
            font-weight: bold;
        }

        .rank-col {
            font-weight: bold;
            color: var(--accent);
            width: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏆 Şagird Reytinq Paneli</h1>
            <div class="tabs">
                <button class="tab-btn active" id="btn-cpp" onclick="switchTab('cpp')">C++</button>
                <button class="tab-btn" id="btn-python" onclick="switchTab('python')">Python</button>
                <button class="tab-btn" id="btn-common" onclick="switchTab('common')">Common</button>
            </div>
        </div>

        <div class="action-bar">
            <button class="refresh-btn" onclick="sortAndRender()">
                🔄 Reytinqə Görə Sırala (Sıralama)
            </button>
        </div>

        <div class="table-wrapper">
            <table id="ratingTable">
                <thead></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let globalData = {
          cpp: [
            { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", fm: 85, stepping: 90, e_olimp: 75, codesources: 88, hackerrank: 92, kecmis_reyting: 410 },
            { id: 2, ad: "Aysel Əliyeva", foto: "https://i.pravatar.cc/150?img=5", fm: 95, stepping: 88, e_olimp: 90, codesources: 94, hackerrank: 96, kecmis_reyting: 450 },
            { id: 3, ad: "Murad Həsənov", foto: "https://i.pravatar.cc/150?img=12", fm: 60, stepping: 70, e_olimp: 65, codesources: 72, hackerrank: 80, kecmis_reyting: 360 }
          ],
          python: [
            { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", fm: 90, stepping: 95, e_olimp: 85, codesources: 90, hackerrank: 94, kecmis_reyting: 430 },
            { id: 2, ad: "Leyla Quliyeva", foto: "https://i.pravatar.cc/150?img=9", fm: 88, stepping: 92, e_olimp: 80, codesources: 85, hackerrank: 90, kecmis_reyting: 420 }
          ],
          common: [
            { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", cari_reyting: 884, kecmis_reyting: 840 },
            { id: 2, ad: "Aysel Əliyeva", foto: "https://i.pravatar.cc/150?img=5", cari_reyting: 913, kecmis_reyting: 890 }
          ]
        };

        let currentTab = 'cpp';

        function switchTab(tabName) {
          currentTab = tabName;
          document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
          document.getElementById('btn-' + tabName).classList.add('active');
          renderTable();
        }

        function calculateTotals(student) {
          if (currentTab === 'common') {
            const artim = student.cari_reyting - student.kecmis_reyting;
            return { ...student, artim };
          } else {
            const cari = (student.fm || 0) + (student.stepping || 0) + (student.e_olimp || 0) + (student.codesources || 0) + (student.hackerrank || 0);
            const artim = cari - (student.kecmis_reyting || 0);
            return { ...student, cari_reyting: cari, artim };
          }
        }

        function renderTable() {
          const tableHead = document.querySelector('#ratingTable thead');
          const tableBody = document.querySelector('#tableBody');
          const rawList = globalData[currentTab] || [];
          const list = rawList.map(calculateTotals);

          if (currentTab === 'common') {
            tableHead.innerHTML = `
              <tr>
                <th>#</th>
                <th>Şagird</th>
                <th>Cari Reytinq</th>
                <th>Keçmiş Reytinq</th>
                <th>Artım</th>
              </tr>
            `;
          } else {
            tableHead.innerHTML = `
              <tr>
                <th>#</th>
                <th>Şagird</th>
                <th>FM</th>
                <th>Stepping.org</th>
                <th>e-olimp.com</th>
                <th>codesources.com</th>
                <th>hackerrank.com</th>
                <th>Cari Reytinq</th>
                <th>Keçmiş Reytinq</th>
                <th>Artım</th>
              </tr>
            `;
          }

          tableBody.innerHTML = '';
          list.forEach((item, index) => {
            const row = document.createElement('tr');
            const artimClass = item.artim >= 0 ? 'badge-positive' : 'badge-negative';
            const artimSign = item.artim >= 0 ? `+${item.artim}` : item.artim;

            if (currentTab === 'common') {
              row.innerHTML = `
                <td class="rank-col">${index + 1}</td>
                <td>
                  <div class="student-info">
                    <img class="avatar" src="${item.foto}" alt="${item.ad}">
                    <span class="student-name">${item.ad}</span>
                  </div>
                </td>
                <td><strong>${item.cari_reyting}</strong></td>
                <td>${item.kecmis_reyting}</td>
                <td class="${artimClass}">${artimSign}</td>
              `;
            } else {
              row.innerHTML = `
                <td class="rank-col">${index + 1}</td>
                <td>
                  <div class="student-info">
                    <img class="avatar" src="${item.foto}" alt="${item.ad}">
                    <span class="student-name">${item.ad}</span>
                  </div>
                </td>
                <td>${item.fm}</td>
                <td>${item.stepping}</td>
                <td>${item.e_olimp}</td>
                <td>${item.codesources}</td>
                <td>${item.hackerrank}</td>
                <td><strong>${item.cari_reyting}</strong></td>
                <td>${item.kecmis_reyting}</td>
                <td class="${artimClass}">${artimSign}</td>
              `;
            }
            tableBody.appendChild(row);
          });
        }

        function sortAndRender() {
          if (!globalData[currentTab]) return;
          globalData[currentTab].sort((a, b) => {
            const totalA = calculateTotals(a).cari_reyting;
            const totalB = calculateTotals(b).cari_reyting;
            return totalB - totalA;
          });
          renderTable();
        }

        // Səhifə yüklənən kimi cədvəli göstər
        document.addEventListener("DOMContentLoaded", function() {
            renderTable();
        });
    </script>
</body>
</html>
