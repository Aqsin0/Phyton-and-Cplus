<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saytın Ünvanı Dəyişdirildi</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1121;
            --card-bg: #151e32;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #2a364f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .redirect-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        p {
            color: var(--text-sub);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .new-link {
            display: inline-block;
            background-color: var(--accent);
            color: #ffffff;
            font-weight: 900;
            font-size: 18px;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            word-break: break-all;
        }

        .new-link:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }

        .timer-text {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 700;
        }

        span#seconds {
            color: var(--accent);
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="redirect-container">
        <div class="icon">🚀</div>
        <h1>Saytın Ünvanı Yeniləndi!</h1>
        <p>Saytımız daha sürətli və yeni ünvana köçürüldü. Zəhmət olmasa, aşağıdakı keçidə klikləyin və ya avtomatik yönləndirməni gözləyin:</p>
        
        <a href="https://tt08-bdu.web.app" class="new-link" id="redirectLink">tt08-bdu.web.app</a>
        
        <div class="timer-text">
            <span id="seconds">5</span> saniyə ərzində avtomatik keçid ediləcək...
        </div>
    </div>

    <script>
        // Yeni ünvan
        const targetUrl = "https://tt08-bdu.web.app";
        let timeLeft = 5;

        // Geri sayım və avtomatik yönləndirmə mexanizmi
        const timerElement = document.getElementById("seconds");
        
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>

</body>
</html>
