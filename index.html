<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şagird Reytinq Paneli</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-inner: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --positive: #22c55e;
            --negative: #ef4444;
            --border: #334155;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #d97706;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 1250px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        h1 { margin: 0; font-size: 24px; color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

        .tabs { display: flex; gap: 8px; flex-wrap: wrap; }

        .tab-btn {
            background-color: var(--card-inner);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-admin { background-color: #e11d48; }

        /* Həftənin Zirvədəkiləri Dashboard */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .highlight-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
        }

        .highlight-card h3 {
            margin-top: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .mini-list { list-style: none; padding: 0; margin: 0; }
        .mini-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .mini-list li:last-child { border-bottom: none; }

        /* Cədvəl Dizaynı */
        .table-wrapper {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow-x: auto;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 850px; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        th { background-color: #0f172a; color: var(--accent); font-size: 13px; letter-spacing: 0.5px; }
        tr:hover { background-color: rgba(56, 189, 248, 0.05); }

        .student-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }

        /* Qurucu (Jüri) Stili */
        .founder-row {
            background: rgba(245, 158, 11, 0.05) !important;
        }
        .founder-badge {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        .badge-positive { color: var(--positive); font-weight: bold; background: rgba(34, 197, 94, 0.1); padding: 4px 8px; border-radius: 6px; }
        .badge-negative { color: var(--negative); font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 4px 8px; border-radius: 6px; }
        .rank-col { font-weight: bold; color: var(--accent); width: 40px; font-size: 16px; }

        /* Modal Stiller */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            max-width: 800px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .admin-student-card {
            background: var(--card-inner);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .grid-inputs label { font-size: 11px; color: var(--text-sub); display: block; margin-bottom: 3px; }
        .grid-inputs input {
            width: 100%; padding: 6px 8px; border-radius: 6px;
            border: 1px solid var(--border); background: #0f172a; color: white;
            font-weight: bold; box-sizing: border-box;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input {
            width: 100%; padding: 10px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--card-inner); color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏆 Şagird Reytinq Paneli</h1>
            <div class="tabs">
                <button class="tab-btn active" id="btn-cpp" onclick="switchTab('cpp')">C++</button>
                <button class="tab-btn" id="btn-python" onclick="switchTab('python')">Python</button>
                <button class="tab-btn" id="btn-common" onclick="switchTab('common')">Common</button>
            </div>
        </div>

        <!-- Həftənin Zirvədəkiləri -->
        <div class="highlights-grid">
            <div class="highlight-card">
                <h3 style="color:var(--gold);">🥇 Həftənin Liderləri</h3>
                <ul class="mini-list" id="topList"></ul>
            </div>
            <div class="highlight-card">
                <h3 style="color:var(--accent);">⚡ Ötən Həftənin Çempionları</h3>
                <ul class="mini-list" id="pastTopList"></ul>
            </div>
            <div class="highlight-card">
                <h3 style="color:var(--negative);">🚀 Yüksəliş Gözlənilənlər</h3>
                <ul class="mini-list" id="bottomList"></ul>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-admin" onclick="showLoginModal()">🔑 Admin Girişi</button>
            <button class="btn" onclick="sortAndRender()">🔄 Reytinqə Görə Sırala</button>
        </div>

        <div class="table-wrapper">
            <table id="ratingTable">
                <thead></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content" style="max-width:400px;">
            <h2 style="margin-top:0; color:var(--accent);">🔑 Admin Girişi</h2>
            <div class="form-group">
                <label>İstifadəçi Adı:</label>
                <input type="text" id="loginUser" placeholder="İstifadəçi adınızı daxil edin" onkeydown="handleUserKey(event)">
            </div>
            <div class="form-group">
                <label>Şifrə:</label>
                <input type="password" id="loginPass" placeholder="Şifrənizi daxil edin" onkeydown="handlePassKey(event)">
            </div>
            <button class="btn btn-admin" style="width:100%;" onclick="handleLogin()">Giriş Et</button>
            <button class="btn" style="width:100%; margin-top:10px; background:#64748b;" onclick="closeLoginModal()">Ləğv Et</button>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h2 id="welcomeAdmin" style="margin-top:0; color:var(--accent);">⚙️ Admin Paneli</h2>
            <p style="font-size:12px; color:var(--text-sub);">💡 Qeyd: Cari Reytinq və Artım avtomatik hesablanır. Siz yalnız platforma ballarını və keçmiş reytinqi dəyişə bilərsiniz.</p>
            <div id="adminBody"></div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn" style="flex:2;" onclick="saveAdminChanges()">💾 Yadda Saxla və Yayımla</button>
                <button class="btn" style="flex:1; background:#64748b;" onclick="closeAdminPanel()">Çıxış Et</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAug3XL0WtYr6a-_9qcLMjiE16oEA-y5XU",
            authDomain: "phyton-and-cplus.firebaseapp.com",
            databaseURL: "https://phyton-and-cplus-default-rtdb.firebaseio.com",
            projectId: "phyton-and-cplus",
            storageBucket: "phyton-and-cplus.firebasestorage.app",
            messagingSenderId: "717355992977",
            appId: "1:717355992977:web:90a1dd87e1de84e4a8fc30",
            measurementId: "G-6QEQ76ZJV1"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ADMIN_USERS = {
            "Jagermaster": "Aqsin2008",
            "Chivas": "Turan2008",
            "Jameson": "Kenan2007"
        };

        // Qurucular / Jürilər siyahısı
        const FOUNDERS = ["Süleymanzadə Aqşin", "Məmmədli Turan", "Gülverdiyev Kənan"];

        // 25 Şagirdin Siyahısı
        const STUDENT_NAMES = [
            "Abbasov Rüfət", "Abıyeva Aysun", "Ağazadə poladxan", "Allahverdiyev Amid",
            "Bəbirov Soltan", "Cavadzadə Mirzə", "Əhmədli Bahar", "Əliyeva Əsmər",
            "Əliyeva Hüsna", "Əliyeva Mehriban", "Əlizadə Rəhimə", "Əsgərova Çinarə",
            "Fərzalı Səma", "Gülverdiyev Kənan", "Həşimova Fatimə", "Hüseyinova Səbinə",
            "Hüseyinzadə Aygün", "İbrahimova Rəşqəndə", "Məmmədli Əhməd", "Məmmədli Turan",
            "Məmmədova Sabrina", "Musazadə Rəşad", "Süleymanzadə Aqşin", "Şəmsiyev Xosu",
            "Təhməzova Leyla"
        ];

        let activeAdminUser = null;
        let globalData = {};
        let currentTab = 'cpp';

        database.ref('students_data').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.cpp && data.cpp.length === 25) {
                globalData = data;
            } else {
                // İlkin 25 şagird məlumatının formalaşdırılması
                globalData = {
                    cpp: STUDENT_NAMES.map((name, i) => ({ id: i+1, ad: name, foto: `https://i.pravatar.cc/150?img=${(i%70)+1}`, fm: 0, stepping: 0, e_olimp: 0, codesources: 0, hackerrank: 0, kecmis_reyting: 0 })),
                    python: STUDENT_NAMES.map((name, i) => ({ id: i+1, ad: name, foto: `https://i.pravatar.cc/150?img=${(i%70)+1}`, fm: 0, stepping: 0, e_olimp: 0, codesources: 0, hackerrank: 0, kecmis_reyting: 0 })),
                    common: STUDENT_NAMES.map((name, i) => ({ id: i+1, ad: name, foto: `https://i.pravatar.cc/150?img=${(i%70)+1}`, kecmis_reyting: 0 }))
                };
                database.ref('students_data').set(globalData);
            }
            renderTable();
            if (activeAdminUser) renderAdminBody();
        });

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + tabName).classList.add('active');
            renderTable();
            if (activeAdminUser) renderAdminBody();
        }

        function calculateTotals(student, index) {
            if (currentTab === 'common') {
                const cppStudent = globalData.cpp ? globalData.cpp[index] : null;
                const pyStudent = globalData.python ? globalData.python[index] : null;
                
                const cppCari = cppStudent ? (cppStudent.fm||0)+(cppStudent.stepping||0)+(cppStudent.e_olimp||0)+(cppStudent.codesources||0)+(cppStudent.hackerrank||0) : 0;
                const pyCari = pyStudent ? (pyStudent.fm||0)+(pyStudent.stepping||0)+(pyStudent.e_olimp||0)+(pyStudent.codesources||0)+(pyStudent.hackerrank||0) : 0;
                
                const cari = cppCari + pyCari;
                const artim = cari - Number(student.kecmis_reyting || 0);
                return { ...student, cari_reyting: cari, artim };
            } else {
                const cari = Number(student.fm || 0) + Number(student.stepping || 0) + Number(student.e_olimp || 0) + Number(student.codesources || 0) + Number(student.hackerrank || 0);
                const artim = cari - Number(student.kecmis_reyting || 0);
                return { ...student, cari_reyting: cari, artim };
            }
        }

        function renderTable() {
            const tableHead = document.querySelector('#ratingTable thead');
            const tableBody = document.querySelector('#tableBody');
            const rawList = globalData[currentTab] || [];
            const list = rawList.map((s, idx) => calculateTotals(s, idx));

            updateHighlights(list);

            if (currentTab === 'common') {
                tableHead.innerHTML = `<tr><th>#</th><th>Şagird</th><th>Cari Reytinq</th><th>Keçmiş Reytinq</th><th>Artım</th></tr>`;
            } else {
                tableHead.innerHTML = `<tr><th>#</th><th>Şagird</th><th>FM</th><th>Stepping.org</th><th>e-olimp.com</th><th>codesources.com</th><th>hackerrank.com</th><th>Cari Reytinq</th><th>Keçmiş Reytinq</th><th>Artım</th></tr>`;
            }

            tableBody.innerHTML = '';
            list.forEach((item, index) => {
                const row = document.createElement('tr');
                const isFounder = FOUNDERS.includes(item.ad);
                if (isFounder) row.classList.add('founder-row');

                const artimClass = item.artim >= 0 ? 'badge-positive' : 'badge-negative';
                const artimSign = item.artim >= 0 ? `+${item.artim}` : item.artim;
                const founderBadge = isFounder ? `<span class="founder-badge">👑 JÜRİ</span>` : '';

                if (currentTab === 'common') {
                    row.innerHTML = `
                        <td class="rank-col">${index + 1}</td>
                        <td><div class="student-info"><img class="avatar" src="${item.foto}"><span>${item.ad} ${founderBadge}</span></div></td>
                        <td><strong>${item.cari_reyting}</strong></td>
                        <td>${item.kecmis_reyting}</td>
                        <td class="${artimClass}">${artimSign}</td>
                    `;
                } else {
                    row.innerHTML = `
                        <td class="rank-col">${index + 1}</td>
                        <td><div class="student-info"><img class="avatar" src="${item.foto}"><span>${item.ad} ${founderBadge}</span></div></td>
                        <td>${item.fm}</td><td>${item.stepping}</td><td>${item.e_olimp}</td><td>${item.codesources}</td><td>${item.hackerrank}</td>
                        <td><strong>${item.cari_reyting}</strong></td>
                        <td>${item.kecmis_reyting}</td>
                        <td class="${artimClass}">${artimSign}</td>
                    `;
                }
                tableBody.appendChild(row);
            });
        }

        function updateHighlights(list) {
            const sortedCurrent = [...list].sort((a,b) => b.cari_reyting - a.cari_reyting);
            const sortedPast = [...list].sort((a,b) => b.kecmis_reyting - a.kecmis_reyting);

            // Həftənin Liderləri (Top 3)
            const topList = document.getElementById('topList');
            topList.innerHTML = sortedCurrent.slice(0, 3).map((s, i) => 
                `<li><span>${i===0?'👑':i===1?'🥈':'🥉'} ${s.ad}</span><strong>${s.cari_reyting} pt</strong></li>`
            ).join('');

            // Ötən Həftənin Çempionları (Top 3)
            const pastTopList = document.getElementById('pastTopList');
            pastTopList.innerHTML = sortedPast.slice(0, 3).map((s, i) => 
                `<li><span>⭐ ${s.ad}</span><span>${s.kecmis_reyting} pt</span></li>`
            ).join('');

            // Sonuncu 3 nəfər
            const bottomList = document.getElementById('bottomList');
            bottomList.innerHTML = sortedCurrent.slice(-3).reverse().map(s => 
                `<li><span>⚠️ ${s.ad}</span><span style="color:var(--negative);">${s.cari_reyting} pt</span></li>`
            ).join('');
        }

        function sortAndRender() {
            if (!globalData[currentTab]) return;
            globalData[currentTab].sort((a, b) => {
                const idxA = globalData[currentTab].indexOf(a);
                const idxB = globalData[currentTab].indexOf(b);
                return calculateTotals(b, idxB).cari_reyting - calculateTotals(a, idxA).cari_reyting;
            });
            renderTable();
        }

        function handleUserKey(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                document.getElementById('loginPass').focus();
            }
        }

        function handlePassKey(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                handleLogin();
            }
        }

        function showLoginModal() {
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginModal').style.display = 'flex';
            setTimeout(() => document.getElementById('loginUser').focus(), 100);
        }

        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if (ADMIN_USERS[user] && ADMIN_USERS[user] === pass) {
                activeAdminUser = user;
                closeLoginModal();
                openAdminPanel();
            } else {
                alert("İstifadəçi adı və ya şifrə yanlışdır!");
            }
        }

        function openAdminPanel() {
            document.getElementById('welcomeAdmin').innerText = `⚙️ Admin: ${activeAdminUser} (${currentTab.toUpperCase()})`;
            renderAdminBody();
            document.getElementById('adminModal').style.display = 'flex';
        }

        function renderAdminBody() {
            const rawList = globalData[currentTab] || [];
            const adminBody = document.getElementById('adminBody');
            adminBody.innerHTML = '';

            rawList.forEach((student, index) => {
                let fieldsHTML = '';
                if (currentTab === 'common') {
                    fieldsHTML = `
                        <div><label>Keçmiş Reytinq</label><input type="number" id="inp_${index}_kecmis" value="${student.kecmis_reyting || 0}"></div>
                    `;
                } else {
                    fieldsHTML = `
                        <div><label>FM</label><input type="number" id="inp_${index}_fm" value="${student.fm || 0}"></div>
                        <div><label>Stepping</label><input type="number" id="inp_${index}_stepping" value="${student.stepping || 0}"></div>
                        <div><label>e-Olimp</label><input type="number" id="inp_${index}_e_olimp" value="${student.e_olimp || 0}"></div>
                        <div><label>CodeSources</label><input type="number" id="inp_${index}_codesources" value="${student.codesources || 0}"></div>
                        <div><label>HackerRank</label><input type="number" id="inp_${index}_hackerrank" value="${student.hackerrank || 0}"></div>
                        <div><label>Keçmiş Reytinq</label><input type="number" id="inp_${index}_kecmis" value="${student.kecmis_reyting || 0}"></div>
                    `;
                }

                adminBody.innerHTML += `
                    <div class="admin-student-card">
                        <strong>${index+1}. ${student.ad}</strong>
                        <div class="grid-inputs">
                            ${fieldsHTML}
                        </div>
                    </div>
                `;
            });
        }

        function closeAdminPanel() {
            activeAdminUser = null;
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveAdminChanges() {
            (globalData[currentTab] || []).forEach((student, index) => {
                if (currentTab === 'common') {
                    if (document.getElementById(`inp_${index}_kecmis`)) {
                        student.kecmis_reyting = Number(document.getElementById(`inp_${index}_kecmis`).value);
                    }
                } else {
                    if (document.getElementById(`inp_${index}_fm`)) {
                        student.fm = Number(document.getElementById(`inp_${index}_fm`).value);
                        student.stepping = Number(document.getElementById(`inp_${index}_stepping`).value);
                        student.e_olimp = Number(document.getElementById(`inp_${index}_e_olimp`).value);
                        student.codesources = Number(document.getElementById(`inp_${index}_codesources`).value);
                        student.hackerrank = Number(document.getElementById(`inp_${index}_hackerrank`).value);
                        student.kecmis_reyting = Number(document.getElementById(`inp_${index}_kecmis`).value);
                    }
                }
            });

            database.ref('students_data').set(globalData).then(() => {
                alert(`Dəyişikliklər ${activeAdminUser} tərəfindən canlı yayımlandı! 🚀`);
                closeAdminPanel();
            });
        }
    </script>
</body>
</html>
