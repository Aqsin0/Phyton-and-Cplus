<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şagird Reytinq Paneli</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-inner: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --positive: #22c55e;
            --negative: #ef4444;
            --border: #334155;
            --purple: #a855f7;
            --danger: #f43f5e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        h1 { margin: 0; font-size: 26px; color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

        .tabs { display: flex; gap: 10px; }

        .tab-btn {
            background-color: var(--card-inner);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }
        .btn-admin { background-color: #e11d48; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }
        .btn-add { background-color: var(--purple); box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3); }

        .table-wrapper {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow-x: auto;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        th, td { padding: 15px 18px; border-bottom: 1px solid var(--border); }
        th { background-color: #0f172a; color: var(--accent); font-size: 13px; letter-spacing: 0.5px; }
        tr { transition: background 0.2s; }
        tr:hover { background-color: rgba(56, 189, 248, 0.05); }

        .student-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
        .badge-positive { color: var(--positive); font-weight: bold; background: rgba(34, 197, 94, 0.1); padding: 4px 8px; border-radius: 6px; }
        .badge-negative { color: var(--negative); font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 4px 8px; border-radius: 6px; }
        .rank-col { font-weight: bold; color: var(--accent); width: 40px; font-size: 16px; }

        /* Modal Stiller */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center; align-items: center;
            z-index: 1000;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 20px;
            max-width: 750px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-inner);
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card div { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        .stat-card span { font-size: 22px; font-weight: bold; color: var(--accent); }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-inner);
            color: white;
            margin-bottom: 18px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }

        .admin-student-card {
            background: var(--card-inner);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }
        .admin-student-card:hover { border-color: rgba(56, 189, 248, 0.4); }

        .admin-student-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .grid-inputs label {
            font-size: 11px;
            color: var(--text-sub);
            display: block;
            margin-bottom: 4px;
        }

        .grid-inputs input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: white;
            font-weight: bold;
            box-sizing: border-box;
            outline: none;
        }
        .grid-inputs input:focus { border-color: var(--accent); }

        .btn-delete {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: var(--danger); color: white; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-sub); font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--card-inner); color: white;
            box-sizing: border-box; outline: none;
        }
        .form-group input:focus { border-color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏆 Şagird Reytinq Paneli</h1>
            <div class="tabs">
                <button class="tab-btn active" id="btn-cpp" onclick="switchTab('cpp')">C++</button>
                <button class="tab-btn" id="btn-python" onclick="switchTab('python')">Python</button>
                <button class="tab-btn" id="btn-common" onclick="switchTab('common')">Common</button>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-admin" onclick="showLoginModal()">🔑 Admin Girişi</button>
            <button class="btn" onclick="sortAndRender()">🔄 Reytinqə Görə Sırala</button>
        </div>

        <div class="table-wrapper">
            <table id="ratingTable">
                <thead></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 1. Giriş Pəncərəsi (Login Modal) -->
    <div id="loginModal" class="modal">
        <div class="modal-content" style="max-width:420px;">
            <h2 style="margin-top:0; color:var(--accent);">🔑 Admin Girişi</h2>
            <div class="form-group">
                <label>İstifadəçi Adı:</label>
                <input type="text" id="loginUser" placeholder="İstifadəçi adınızı daxil edin" onkeydown="handleUserKey(event)">
            </div>
            <div class="form-group">
                <label>Şifrə:</label>
                <input type="password" id="loginPass" placeholder="Şifrənizi daxil edin" onkeydown="handlePassKey(event)">
            </div>
            <button class="btn btn-admin" style="width:100%; margin-top:5px;" onclick="handleLogin()">Giriş Et</button>
            <button class="btn" style="width:100%; margin-top:10px; background:#64748b;" onclick="closeLoginModal()">Ləğv Et</button>
        </div>
    </div>

    <!-- 2. İnteraktiv Admin Paneli -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
                <h2 id="welcomeAdmin" style="margin:0; color:var(--accent);">⚙️ Admin Paneli</h2>
                <button class="btn btn-add" onclick="addNewStudent()">➕ Yeni Şagird</button>
            </div>

            <!-- İnteraktiv Statistika -->
            <div class="admin-stats">
                <div class="stat-card">
                    <div>Ümumi Şagird Sayı</div>
                    <span id="statCount">0</span>
                </div>
                <div class="stat-card">
                    <div>Orta Reytinq Balı</div>
                    <span id="statAvg">0</span>
                </div>
                <div class="stat-card">
                    <div>Lider Şagird</div>
                    <span id="statTop" style="font-size:15px; color:var(--positive);">-</span>
                </div>
            </div>

            <!-- Canlı Axtarış -->
            <input type="text" id="adminSearch" class="search-box" placeholder="🔍 Şagird adı ilə axtar..." oninput="filterAdminStudents()">

            <div id="adminBody"></div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="flex:2;" onclick="saveAdminChanges()">💾 Yadda Saxla və Yayımla</button>
                <button class="btn" style="flex:1; background:#64748b;" onclick="closeAdminPanel()">Çıxış Et</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAug3XL0WtYr6a-_9qcLMjiE16oEA-y5XU",
            authDomain: "phyton-and-cplus.firebaseapp.com",
            databaseURL: "https://phyton-and-cplus-default-rtdb.firebaseio.com",
            projectId: "phyton-and-cplus",
            storageBucket: "phyton-and-cplus.firebasestorage.app",
            messagingSenderId: "717355992977",
            appId: "1:717355992977:web:90a1dd87e1de84e4a8fc30",
            measurementId: "G-6QEQ76ZJV1"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ADMIN_USERS = {
            "Jagermaster": "Aqsin2008",
            "Chivas": "Turan2008",
            "Jameson": "Kenan2007"
        };

        let activeAdminUser = null;
        let globalData = {};
        let currentTab = 'cpp';

        database.ref('students_data').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                globalData = data;
            } else {
                globalData = {
                    cpp: [
                        { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", fm: 85, stepping: 90, e_olimp: 75, codesources: 88, hackerrank: 92, kecmis_reyting: 410 },
                        { id: 2, ad: "Aysel Əliyeva", foto: "https://i.pravatar.cc/150?img=5", fm: 95, stepping: 88, e_olimp: 90, codesources: 94, hackerrank: 96, kecmis_reyting: 450 }
                    ],
                    python: [
                        { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", fm: 90, stepping: 95, e_olimp: 85, codesources: 90, hackerrank: 94, kecmis_reyting: 430 }
                    ],
                    common: [
                        { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", cari_reyting: 884, kecmis_reyting: 840 }
                    ]
                };
                database.ref('students_data').set(globalData);
            }
            renderTable();
            if (activeAdminUser) renderAdminBody();
        });

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + tabName).classList.add('active');
            renderTable();
            if (activeAdminUser) renderAdminBody();
        }

        function calculateTotals(student) {
            if (currentTab === 'common') {
                const artim = Number(student.cari_reyting || 0) - Number(student.kecmis_reyting || 0);
                return { ...student, artim };
            } else {
                const cari = Number(student.fm || 0) + Number(student.stepping || 0) + Number(student.e_olimp || 0) + Number(student.codesources || 0) + Number(student.hackerrank || 0);
                const artim = cari - Number(student.kecmis_reyting || 0);
                return { ...student, cari_reyting: cari, artim };
            }
        }

        function renderTable() {
            const tableHead = document.querySelector('#ratingTable thead');
            const tableBody = document.querySelector('#tableBody');
            const rawList = globalData[currentTab] || [];
            const list = rawList.map(calculateTotals);

            if (currentTab === 'common') {
                tableHead.innerHTML = `<tr><th>#</th><th>Şagird</th><th>Cari Reytinq</th><th>Keçmiş Reytinq</th><th>Artım</th></tr>`;
            } else {
                tableHead.innerHTML = `<tr><th>#</th><th>Şagird</th><th>FM</th><th>Stepping.org</th><th>e-olimp.com</th><th>codesources.com</th><th>hackerrank.com</th><th>Cari Reytinq</th><th>Keçmiş Reytinq</th><th>Artım</th></tr>`;
            }

            tableBody.innerHTML = '';
            list.forEach((item, index) => {
                const row = document.createElement('tr');
                const artimClass = item.artim >= 0 ? 'badge-positive' : 'badge-negative';
                const artimSign = item.artim >= 0 ? `+${item.artim}` : item.artim;

                if (currentTab === 'common') {
                    row.innerHTML = `
                        <td class="rank-col">${index + 1}</td>
                        <td><div class="student-info"><img class="avatar" src="${item.foto}"><span>${item.ad}</span></div></td>
                        <td><strong>${item.cari_reyting}</strong></td>
                        <td>${item.kecmis_reyting}</td>
                        <td class="${artimClass}">${artimSign}</td>
                    `;
                } else {
                    row.innerHTML = `
                        <td class="rank-col">${index + 1}</td>
                        <td><div class="student-info"><img class="avatar" src="${item.foto}"><span>${item.ad}</span></div></td>
                        <td>${item.fm}</td><td>${item.stepping}</td><td>${item.e_olimp}</td><td>${item.codesources}</td><td>${item.hackerrank}</td>
                        <td><strong>${item.cari_reyting}</strong></td>
                        <td>${item.kecmis_reyting}</td>
                        <td class="${artimClass}">${artimSign}</td>
                    `;
                }
                tableBody.appendChild(row);
            });
        }

        function sortAndRender() {
            if (!globalData[currentTab]) return;
            globalData[currentTab].sort((a, b) => calculateTotals(b).cari_reyting - calculateTotals(a).cari_reyting);
            renderTable();
        }

        /* --- Klaviatura və Giriş Əməliyyatları --- */
        function handleUserKey(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                document.getElementById('loginPass').focus();
            }
        }

        function handlePassKey(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                handleLogin();
            }
        }

        function showLoginModal() {
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginModal').style.display = 'flex';
            setTimeout(() => document.getElementById('loginUser').focus(), 100);
        }

        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if (ADMIN_USERS[user] && ADMIN_USERS[user] === pass) {
                activeAdminUser = user;
                closeLoginModal();
                openAdminPanel();
            } else {
                alert("İstifadəçi adı və ya şifrə yanlışdır!");
            }
        }

        function openAdminPanel() {
            document.getElementById('welcomeAdmin').innerText = `⚙️ Admin: ${activeAdminUser} (${currentTab.toUpperCase()})`;
            renderAdminBody();
            document.getElementById('adminModal').style.display = 'flex';
        }

        function renderAdminBody(filterQuery = '') {
            const list = (globalData[currentTab] || []).map(calculateTotals);
            const adminBody = document.getElementById('adminBody');
            adminBody.innerHTML = '';

            const totalStudents = list.length;
            const avgRating = totalStudents > 0 ? Math.round(list.reduce((acc, s) => acc + s.cari_reyting, 0) / totalStudents) : 0;
            const topStudent = totalStudents > 0 ? list.reduce((prev, current) => (prev.cari_reyting > current.cari_reyting) ? prev : current) : null;

            document.getElementById('statCount').innerText = totalStudents;
            document.getElementById('statAvg').innerText = avgRating;
            document.getElementById('statTop').innerText = topStudent ? `${topStudent.ad} (${topStudent.cari_reyting} pt)` : '-';

            const filteredList = list.filter(s => s.ad.toLowerCase().includes(filterQuery.toLowerCase()));

            filteredList.forEach((student, index) => {
                let fieldsHTML = '';
                if (currentTab === 'common') {
                    fieldsHTML = `
                        <div><label>Cari Reytinq</label><input type="number" id="inp_${index}_cari" value="${student.cari_reyting || 0}"></div>
                        <div><label>Keçmiş Reytinq</label><input type="number" id="inp_${index}_kecmis" value="${student.kecmis_reyting || 0}"></div>
                    `;
                } else {
                    fieldsHTML = `
                        <div><label>FM</label><input type="number" id="inp_${index}_fm" value="${student.fm || 0}"></div>
                        <div><label>Stepping</label><input type="number" id="inp_${index}_stepping" value="${student.stepping || 0}"></div>
                        <div><label>e-Olimp</label><input type="number" id="inp_${index}_e_olimp" value="${student.e_olimp || 0}"></div>
                        <div><label>CodeSources</label><input type="number" id="inp_${index}_codesources" value="${student.codesources || 0}"></div>
                        <div><label>HackerRank</label><input type="number" id="inp_${index}_hackerrank" value="${student.hackerrank || 0}"></div>
                        <div><label>Keçmiş Reytinq</label><input type="number" id="inp_${index}_kecmis" value="${student.kecmis_reyting || 0}"></div>
                    `;
                }

                adminBody.innerHTML += `
                    <div class="admin-student-card">
                        <div class="admin-student-header">
                            <div class="student-info">
                                <img class="avatar" src="${student.foto}">
                                <strong>${student.ad}</strong>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span style="font-size:13px; color:var(--accent);">Cari Bal: <strong>${student.cari_reyting}</strong></span>
                                <button class="btn-delete" onclick="deleteStudent(${student.id})">🗑️ Sil</button>
                            </div>
                        </div>
                        <div class="grid-inputs">
                            ${fieldsHTML}
                        </div>
                    </div>
                `;
            });
        }

        function filterAdminStudents() {
            const query = document.getElementById('adminSearch').value;
            renderAdminBody(query);
        }

        function addNewStudent() {
            const name = prompt("Yeni Şagirdin Adı və Soyadı:");
            if (!name) return;

            const photo = prompt("Foto URL-i (Boş bıraxsanız avtomatik avatar təyin ediləcək):") || `https://i.pravatar.cc/150?img=${Math.floor(Math.random()*70)}`;

            if (!globalData[currentTab]) globalData[currentTab] = [];

            const newObj = currentTab === 'common' 
                ? { id: Date.now(), ad: name, foto: photo, cari_reyting: 0, kecmis_reyting: 0 }
                : { id: Date.now(), ad: name, foto: photo, fm: 0, stepping: 0, e_olimp: 0, codesources: 0, hackerrank: 0, kecmis_reyting: 0 };

            globalData[currentTab].push(newObj);
            database.ref('students_data').set(globalData).then(() => {
                alert(`Yeni şagird (${name}) əlavə edildi!`);
            });
        }

        function deleteStudent(id) {
            if (confirm("Bu şagirdi siyahıdan silməyə əminsiniz?")) {
                globalData[currentTab] = globalData[currentTab].filter(s => s.id !== id);
                database.ref('students_data').set(globalData).then(() => {
                    renderAdminBody();
                });
            }
        }

        function closeAdminPanel() {
            activeAdminUser = null;
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveAdminChanges() {
            (globalData[currentTab] || []).forEach((student, index) => {
                if (currentTab === 'common') {
                    if (document.getElementById(`inp_${index}_cari`)) {
                        student.cari_reyting = Number(document.getElementById(`inp_${index}_cari`).value);
                        student.kecmis_reyting = Number(document.getElementById(`inp_${index}_kecmis`).value);
                    }
                } else {
                    if (document.getElementById(`inp_${index}_fm`)) {
                        student.fm = Number(document.getElementById(`inp_${index}_fm`).value);
                        student.stepping = Number(document.getElementById(`inp_${index}_stepping`).value);
                        student.e_olimp = Number(document.getElementById(`inp_${index}_e_olimp`).value);
                        student.codesources = Number(document.getElementById(`inp_${index}_codesources`).value);
                        student.hackerrank = Number(document.getElementById(`inp_${index}_hackerrank`).value);
                        student.kecmis_reyting = Number(document.getElementById(`inp_${index}_kecmis`).value);
                    }
                }
            });

            database.ref('students_data').set(globalData).then(() => {
                alert(`Dəyişikliklər ${activeAdminUser} tərəfindən canlı yayımlandı! 🚀`);
                closeAdminPanel();
            });
        }
    </script>
</body>
</html>
