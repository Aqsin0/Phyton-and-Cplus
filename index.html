<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şagird Reytinq Sistemi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --positive: #22c55e;
            --negative: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            color: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .refresh-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background-color: #1d4ed8;
        }

        .table-wrapper {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #0f172a;
            color: var(--accent);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: #26334d;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .student-name {
            font-weight: 600;
        }

        .badge-positive {
            color: var(--positive);
            font-weight: bold;
        }

        .badge-negative {
            color: var(--negative);
            font-weight: bold;
        }

        .rank-col {
            font-weight: bold;
            color: var(--accent);
            width: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏆 Şagird Reytinq Paneli</h1>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('cpp')">C++</button>
                <button class="tab-btn" onclick="switchTab('python')">Python</button>
                <button class="tab-btn" onclick="switchTab('common')">Common</button>
            </div>
        </div>

        <div class="action-bar">
            <button class="refresh-btn" onclick="sortAndRender()">
                🔄 Reytinqə Görə Sırala (Sıralama)
            </button>
        </div>

        <div class="table-wrapper">
            <table id="ratingTable">
                <thead>
                    <!-- Sütun başlıqları JavaScript tərəfindən yüklənəcək -->
                </thead>
                <tbody id="tableBody">
                    <!-- Sətirlər JavaScript tərəfindən yüklənəcək -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
