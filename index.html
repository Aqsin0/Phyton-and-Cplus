<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şagird Reytinq Paneli</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --positive: #22c55e;
            --negative: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 { margin: 0; font-size: 26px; color: var(--accent); }

        .tabs { display: flex; gap: 10px; }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-admin { background-color: #e11d48; }

        .table-wrapper {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        th { background-color: #0f172a; color: var(--accent); }
        tr:hover { background-color: #26334d; }

        .student-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .badge-positive { color: var(--positive); font-weight: bold; }
        .badge-negative { color: var(--negative); font-weight: bold; }
        .rank-col { font-weight: bold; color: var(--accent); width: 40px; }

        /* Admin Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input {
            width: 100%; padding: 8px; border-radius: 6px;
            border: 1px solid var(--border); background: #0f172a; color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏆 Şagird Reytinq Paneli</h1>
            <div class="tabs">
                <button class="tab-btn active" id="btn-cpp" onclick="switchTab('cpp')">C++</button>
                <button class="tab-btn" id="btn-python" onclick="switchTab('python')">Python</button>
                <button class="tab-btn" id="btn-common" onclick="switchTab('common')">Common</button>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-admin" onclick="openAdminPanel()">🔒 Admin Paneli</button>
            <button class="btn" onclick="sortAndRender()">🔄 Reytinqə Görə Sırala</button>
        </div>

        <div class="table-wrapper">
            <table id="ratingTable">
                <thead></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h2>⚙️ Admin Paneli - Şagird Balı Düzəlt</h2>
            <div id="adminBody"></div>
            <br>
            <button class="btn" onclick="saveAdminChanges()">💾 Yadda Saxla və Yayımla</button>
            <button class="btn" style="background:#64748b;" onclick="closeAdminPanel()">Bağla</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAug3XL0WtYr6a-_9qcLMjiE16oEA-y5XU",
            authDomain: "phyton-and-cplus.firebaseapp.com",
            databaseURL: "https://phyton-and-cplus-default-rtdb.firebaseio.com",
            projectId: "phyton-and-cplus",
            storageBucket: "phyton-and-cplus.firebasestorage.app",
            messagingSenderId: "717355992977",
            appId: "1:717355992977:web:90a1dd87e1de84e4a8fc30",
            measurementId: "G-6QEQ76ZJV1"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ADMIN_PASSWORD = "123456"; // 🔑 Admin Giriş Şifreniz
        let globalData = {};
        let currentTab = 'cpp';

        // Firebase'den verileri canlı dinle
        database.ref('students_data').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                globalData = data;
            } else {
                // İlk kurulum için varsayılan veriler
                globalData = {
                    cpp: [
                        { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", fm: 85, stepping: 90, e_olimp: 75, codesources: 88, hackerrank: 92, kecmis_reyting: 410 },
                        { id: 2, ad: "Aysel Əliyeva", foto: "https://i.pravatar.cc/150?img=5", fm: 95, stepping: 88, e_olimp: 90, codesources: 94, hackerrank: 96, kecmis_reyting: 450 }
                    ],
                    python: [
                        { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", fm: 90, stepping: 95, e_olimp: 85, codesources: 90, hackerrank: 94, kecmis_reyting: 430 }
                    ],
                    common: [
                        { id: 1, ad: "Əli Məmmədov", foto: "https://i.pravatar.cc/150?img=11", cari_reyting: 884, kecmis_reyting: 840 }
                    ]
                };
                database.ref('students_data').set(globalData);
            }
            renderTable();
        });

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + tabName).classList.add('active');
            renderTable();
        }

        function calculateTotals(student) {
            if (currentTab === 'common') {
                const artim = Number(student.cari_reyting || 0) - Number(student.kecmis_reyting || 0);
                return { ...student, artim };
            } else {
                const cari = Number(student.fm || 0) + Number(student.stepping || 0) + Number(student.e_olimp || 0) + Number(student.codesources || 0) + Number(student.hackerrank || 0);
                const artim = cari - Number(student.kecmis_reyting || 0);
                return { ...student, cari_reyting: cari, artim };
            }
        }

        function renderTable() {
            const tableHead = document.querySelector('#ratingTable thead');
            const tableBody = document.querySelector('#tableBody');
            const rawList = globalData[currentTab] || [];
            const list = rawList.map(calculateTotals);

            if (currentTab === 'common') {
                tableHead.innerHTML = `<tr><th>#</th><th>Şagird</th><th>Cari Reytinq</th><th>Keçmiş Reytinq</th><th>Artım</th></tr>`;
            } else {
                tableHead.innerHTML = `<tr><th>#</th><th>Şagird</th><th>FM</th><th>Stepping.org</th><th>e-olimp.com</th><th>codesources.com</th><th>hackerrank.com</th><th>Cari Reytinq</th><th>Keçmiş Reytinq</th><th>Artım</th></tr>`;
            }

            tableBody.innerHTML = '';
            list.forEach((item, index) => {
                const row = document.createElement('tr');
                const artimClass = item.artim >= 0 ? 'badge-positive' : 'badge-negative';
                const artimSign = item.artim >= 0 ? `+${item.artim}` : item.artim;

                if (currentTab === 'common') {
                    row.innerHTML = `
                        <td class="rank-col">${index + 1}</td>
                        <td><div class="student-info"><img class="avatar" src="${item.foto}"><span>${item.ad}</span></div></td>
                        <td><strong>${item.cari_reyting}</strong></td>
                        <td>${item.kecmis_reyting}</td>
                        <td class="${artimClass}">${artimSign}</td>
                    `;
                } else {
                    row.innerHTML = `
                        <td class="rank-col">${index + 1}</td>
                        <td><div class="student-info"><img class="avatar" src="${item.foto}"><span>${item.ad}</span></div></td>
                        <td>${item.fm}</td><td>${item.stepping}</td><td>${item.e_olimp}</td><td>${item.codesources}</td><td>${item.hackerrank}</td>
                        <td><strong>${item.cari_reyting}</strong></td>
                        <td>${item.kecmis_reyting}</td>
                        <td class="${artimClass}">${artimSign}</td>
                    `;
                }
                tableBody.appendChild(row);
            });
        }

        function sortAndRender() {
            if (!globalData[currentTab]) return;
            globalData[currentTab].sort((a, b) => calculateTotals(b).cari_reyting - calculateTotals(a).cari_reyting);
            renderTable();
        }

        /* --- Admin Paneli Fonksiyonları --- */
        function openAdminPanel() {
            const pass = prompt("Admin Şifresini Girin:");
            if (pass !== ADMIN_PASSWORD) {
                alert("Hatalı Şifre!");
                return;
            }

            const adminBody = document.getElementById('adminBody');
            adminBody.innerHTML = '';

            (globalData[currentTab] || []).forEach((student, index) => {
                let fieldsHTML = '';
                if (currentTab === 'common') {
                    fieldsHTML = `
                        <label>Cari Reytinq: <input type="number" id="inp_${index}_cari" value="${student.cari_reyting || 0}"></label>
                        <label>Keçmiş Reytinq: <input type="number" id="inp_${index}_kecmis" value="${student.kecmis_reyting || 0}"></label>
                    `;
                } else {
                    fieldsHTML = `
                        <label>FM: <input type="number" id="inp_${index}_fm" value="${student.fm || 0}"></label>
                        <label>Stepping: <input type="number" id="inp_${index}_stepping" value="${student.stepping || 0}"></label>
                        <label>e-Olimp: <input type="number" id="inp_${index}_e_olimp" value="${student.e_olimp || 0}"></label>
                        <label>CodeSources: <input type="number" id="inp_${index}_codesources" value="${student.codesources || 0}"></label>
                        <label>HackerRank: <input type="number" id="inp_${index}_hackerrank" value="${student.hackerrank || 0}"></label>
                        <label>Keçmiş Reytinq: <input type="number" id="inp_${index}_kecmis" value="${student.kecmis_reyting || 0}"></label>
                    `;
                }

                adminBody.innerHTML += `
                    <div style="border-bottom:1px solid #334155; padding:10px 0;">
                        <strong>${student.ad}</strong>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:5px;">
                            ${fieldsHTML}
                        </div>
                    </div>
                `;
            });

            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveAdminChanges() {
            (globalData[currentTab] || []).forEach((student, index) => {
                if (currentTab === 'common') {
                    student.cari_reyting = Number(document.getElementById(`inp_${index}_cari`).value);
                    student.kecmis_reyting = Number(document.getElementById(`inp_${index}_kecmis`).value);
                } else {
                    student.fm = Number(document.getElementById(`inp_${index}_fm`).value);
                    student.stepping = Number(document.getElementById(`inp_${index}_stepping`).value);
                    student.e_olimp = Number(document.getElementById(`inp_${index}_e_olimp`).value);
                    student.codesources = Number(document.getElementById(`inp_${index}_codesources`).value);
                    student.hackerrank = Number(document.getElementById(`inp_${index}_hackerrank`).value);
                    student.kecmis_reyting = Number(document.getElementById(`inp_${index}_kecmis`).value);
                }
            });

            // Firebase'e kaydet
            database.ref('students_data').set(globalData).then(() => {
                alert("Değişiklikler Canlı Olarak Yayınlandı!");
                closeAdminPanel();
            });
        }
    </script>
</body>
</html>
